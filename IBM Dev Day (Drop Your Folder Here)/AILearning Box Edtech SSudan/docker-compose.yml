version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: learning-box-server
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      JWT_SECRET: change_this_secret
      CLIENT_URL: http://localhost:5173
    volumes:
      - server_data:/app/data

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: learning-box-client
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  server_data:
